services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aes-nexus-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Valores admitidos: auto | neon | docker | local
      DB_PROVIDER: ${DB_PROVIDER:-auto}
      DATABASE_URL: ${DATABASE_URL:-}
      DOCKER_DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://aes_nexus:${POSTGRES_PASSWORD:-aes_nexus_change_me}@postgres:5432/${POSTGRES_DB:-aes_nexus}}
    volumes:
      - aes_nexus_app_data:/app/backend/.data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Base de datos PostgreSQL dedicada por cliente cuando DB_PROVIDER=docker
  # Activar con: docker compose --profile docker-db up -d --build
  postgres:
    image: postgres:16-alpine
    container_name: aes-nexus-postgres
    profiles: ["docker-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aes_nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aes_nexus_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-aes_nexus}
    ports:
      - "${PGPORT_EXPOSED:-5432}:5432"
    volumes:
      - aes_nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aes_nexus} -d ${POSTGRES_DB:-aes_nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aes_nexus_app_data:
  aes_nexus_pgdata:
